<!DOCTYPE html>
<html>
<head>
    <title>MiDiYA - Магазин</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; padding: 10px; background: #f9f9f9; }
        h1 { text-align: center; }
        .product { 
            border: 1px solid #ddd; 
            padding: 15px; 
            margin-bottom: 15px; 
            border-radius: 8px; 
            background: #fff;
        }
        .price { color: green; font-weight: bold; font-size: 20px; }
    </style>
</head>
<body>
    <h1>Мой магазин MiDiYA</h1>

    <!-- Товар 1 -->
    <div class="product">
        <h2>Название товара 1</h2>
        <p>Описание: хорошая вещь, всем советую.</p>
        <p class="price">1500 руб.</p>
    </div>

    <!-- Товар 2 -->
    <div class="product">
        <h2>Название товара 2</h2>
        <p>Описание: ещё одна классная вещь.</p>
        <p class="price">2300 руб.</p>
    </div>

    <!-- Товар 3 -->
    <div class="product">
        <h2>Название товара 3</h2>
        <p>Описание: самый лучший товар.</p>
        <p class="price">999 руб.</p>
    </div>

</body>
</html>
